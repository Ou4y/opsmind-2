services:
  # ─────────────────────────────────────────────
  # Shared Infrastructure
  # ─────────────────────────────────────────────
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: opsmind
      MYSQL_PASSWORD: opsmind
    volumes:
      - mysql_data:/var/lib/mysql
      - ./opsmind-infrastructure/mysql-init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./Services/opsmind-workflow-service/db/init.sql:/docker-entrypoint-initdb.d/10-workflow-init.sql:ro
      - ./Services/opsmind-workflow-service/db/seed_with_hierarchy.sql:/docker-entrypoint-initdb.d/11-workflow-seed.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - opsmind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: opsmind
      RABBITMQ_DEFAULT_PASS: opsmind
    ports:
      - "5772:5672"
      - "25672:15672"
    networks:
      - opsmind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s      # Increased from 5s
      retries: 20       # Increased from 12
      start_period: 90s # Increased from 20s - gives it 1.5 mins to boot

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    ports:
      - "127.0.0.1:27019:27017"
    networks:
      - opsmind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Inventory assets DB (separate from notifications)
  postgres-inventory:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: IS1234567
      POSTGRES_DB: opsmind_assets
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - opsmind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opsmind_assets"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # SMTP capture (web UI on :8025)
  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - opsmind-net
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: opsmind
      PMA_PASSWORD: opsmind
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - opsmind-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Core Services
  # ─────────────────────────────────────────────
  auth-service:
    image: opsmind-auth-service:local
    build:
      context: ./Services/opsmind-authentication
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "3002"
      NODE_ENV: "development"

      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: opsmind
      DB_PASSWORD: opsmind
      DB_NAME: authentication

      JWT_SECRET: "opsmind-local-jwt"
      JWT_EXPIRES_IN: "24h"

      OTP_EXPIRY_MINUTES: "5"
      OTP_LENGTH: "6"

      # Development mode prints OTPs to logs (no real SMTP needed)
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "noreply@opsmind.local"

      # Auth -> Workflow identity sync (must use Docker service DNS from inside container)
      WORKFLOW_SERVICE_URL: http://workflow-service:3003
      WORKFLOW_SYNC_TIMEOUT_MS: "5000"
      INTERNAL_API_TOKEN: "opsmind-internal-dev-token"

      CORS_ORIGIN: "*"
    ports:
      - "3012:3002"
    networks:
      - opsmind-net
    restart: unless-stopped

  workflow-service:
    image: opsmind-workflow-service:local
    build:
      context: ./Services/opsmind-workflow-service
      dockerfile: Dockerfile
      target: runner
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      ticket-service:
        condition: service_healthy
      sla-service:
        condition: service_started
    environment:
      NODE_ENV: "production"
      PORT: "3003"
      SERVICE_NAME: opsmind-workflow

      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: workflow_db

      AUTH_SERVICE_URL: http://auth-service:3002
      TICKET_SERVICE_URL: http://ticket-service:3000
      SLA_SERVICE_URL: http://sla-service:3004
      RABBITMQ_URL: amqp://opsmind:opsmind@rabbitmq:5672
      INTERNAL_API_TOKEN: "opsmind-internal-dev-token"

      JWT_SECRET: "opsmind-local-jwt"
      LOG_LEVEL: info
    ports:
      - "3003:3003"
    networks:
      - opsmind-net
    restart: unless-stopped

  ticket-service:
    image: opsmind-ticket-service:local
    build:
      context: ./Services/opsmind-ticket-service
      dockerfile: Dockerfile
      target: runner
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      sla-service:
        condition: service_started
    environment:
      NODE_ENV: "production"
      PORT: "3000"

      DATABASE_URL: mysql://opsmind:opsmind@mysql:3306/Tickets
      RABBITMQ_URL: amqp://opsmind:opsmind@rabbitmq:5672
      USER_SERVICE_URL: http://auth-service:3002
      SLA_SERVICE_URL: http://sla-service:3004
      WORKFLOW_SERVICE_URL: http://workflow-service:3003
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_MS: "3000"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-45000}
      AI_DEBUG_RAW_OUTPUT: ${AI_DEBUG_RAW_OUTPUT:-false}
      INTERNAL_API_TOKEN: "opsmind-internal-dev-token"

      CORS_ORIGINS: http://localhost:8085,http://localhost:8080

      # For the HTTP notification client (if enabled)
      NOTIFICATION_URL: http://notification-service:3000/api/notifications
      NOTIFICATION_INTERNAL_SECRET: "supersecret"
    command: ["sh", "-c", "npm run db:migrate:prod && node dist/server.js"]
    ports:
      - "3001:3000"
    networks:
      - opsmind-net
    restart: unless-stopped

  notification-service:
    image: opsmind-notification-service:local
    build:
      context: ./Services/notification-service
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      PORT: "3000"
      NODE_ENV: "development"

      RABBITMQ_URL: amqp://opsmind:opsmind@rabbitmq:5672
      MONGO_URI: mongodb://mongodb:27017/notificationDB

      EMAIL_HOST: mailhog
      EMAIL_PORT: "1025"
      EMAIL_USER: noreply@opsmind.local
      EMAIL_PASS: ""
    ports:
      - "3005:3000"
    networks:
      - opsmind-net
    restart: unless-stopped

  sla-service:
    image: opsmind-sla-service:local
    build:
      context: ./Services/opsmind-sla-service
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: "3004"
      NODE_ENV: "development"
      JWT_SECRET: "opsmind-local-jwt"
      DATABASE_URL: mysql://opsmind:opsmind@mysql:3306/sla_db
      RABBITMQ_URL: amqp://opsmind:opsmind@rabbitmq:5672

      # Publish SLA events to the same exchange other services use
      RABBITMQ_SLA_EXCHANGE: ticket.events
      RABBITMQ_NOTIFICATION_WARNING_KEY: ticket.notification.slaWarning
      RABBITMQ_NOTIFICATION_BREACH_KEY: ticket.notification.slaBreached

      CORS_ORIGINS: http://localhost:8085,http://localhost:3001
      SLA_CHECK_INTERVAL_MS: "60000"
      SLA_AUTO_REQUEST_WORKFLOW_ON_RESPONSE_BREACH: "false"
      SLA_AUTO_REQUEST_WORKFLOW_ON_RESOLUTION_BREACH: "false"
    ports:
      - "3004:3004"
    networks:
      - opsmind-net
    restart: unless-stopped

  inventory-backend:
    image: opsmind-inventory-backend:local
    build:
      context: ./Services/inventory-backend
      dockerfile: Dockerfile
    depends_on:
      postgres-inventory:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-ai-service:
        condition: service_healthy
    environment:
      PORT: "5000"
      NODE_ENV: "production"
      JWT_SECRET: "opsmind-local-jwt"

      DATABASE_URL: postgresql://postgres:IS1234567@postgres-inventory:5432/opsmind_assets
      RABBITMQ_URI: amqp://opsmind:opsmind@rabbitmq:5672
      INVENTORY_BACKEND_INTERNAL_URL: http://inventory-backend:5000
      INVENTORY_AI_SERVICE_URL: http://inventory-ai-service:8000
      SPEC_VERIFICATION_CONFIDENCE_THRESHOLD: ${SPEC_VERIFICATION_CONFIDENCE_THRESHOLD:-0.85}
      SPEC_LOOKUP_ENABLED: ${SPEC_LOOKUP_ENABLED:-false}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SERPAPI_ENDPOINT: ${SERPAPI_ENDPOINT:-https://serpapi.com/search.json}
      SPEC_LOOKUP_TIMEOUT_MS: ${SPEC_LOOKUP_TIMEOUT_MS:-12000}
      SPEC_LOOKUP_SEARCH_TIMEOUT_MS: ${SPEC_LOOKUP_SEARCH_TIMEOUT_MS:-12000}
      SPEC_LOOKUP_FETCH_TIMEOUT_MS: ${SPEC_LOOKUP_FETCH_TIMEOUT_MS:-12000}
      SPEC_LOOKUP_EXTRACTION_TIMEOUT_MS: ${SPEC_LOOKUP_EXTRACTION_TIMEOUT_MS:-35000}
      SPEC_LOOKUP_TOTAL_TIMEOUT_MS: ${SPEC_LOOKUP_TOTAL_TIMEOUT_MS:-90000}
      SPEC_LOOKUP_MAX_RESULTS: ${SPEC_LOOKUP_MAX_RESULTS:-5}
      SPEC_LOOKUP_ALLOWED_DOMAINS_ONLY: ${SPEC_LOOKUP_ALLOWED_DOMAINS_ONLY:-true}
      SPEC_LOOKUP_CACHE_ENABLED: ${SPEC_LOOKUP_CACHE_ENABLED:-true}
      SPEC_LOOKUP_CACHE_TTL_DAYS: ${SPEC_LOOKUP_CACHE_TTL_DAYS:-90}
      SPEC_LOOKUP_MAX_FETCH_BYTES: ${SPEC_LOOKUP_MAX_FETCH_BYTES:-500000}
      AUTH_SERVICE_URL: http://auth-service:3002
      INTERNAL_API_TOKEN: "opsmind-internal-dev-token"

      # (Optional) if the inventory backend posts notifications via HTTP
      NOTIFICATION_API_URL: http://notification-service:3000/api/notifications
      INTERNAL_SECRET: "supersecret"
    command: ["sh", "-c", "npm run db:migrate:prod && npm run api"]
    ports:
      - "5000:5000"
    volumes:
      - ./Services/inventory-backend/datasets/cache:/usr/src/app/datasets/cache
    networks:
      - opsmind-net
    restart: unless-stopped

  inventory-backend-worker:
    image: opsmind-inventory-backend:local
    build:
      context: ./Services/inventory-backend
      dockerfile: Dockerfile
    depends_on:
      postgres-inventory:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-backend:
        condition: service_started
    environment:
      PORT: "5000"
      NODE_ENV: "production"

      DATABASE_URL: postgresql://postgres:IS1234567@postgres-inventory:5432/opsmind_assets
      RABBITMQ_URI: amqp://opsmind:opsmind@rabbitmq:5672
      INVENTORY_AI_SERVICE_URL: http://inventory-ai-service:8000
      SPEC_VERIFICATION_CONFIDENCE_THRESHOLD: ${SPEC_VERIFICATION_CONFIDENCE_THRESHOLD:-0.85}
      SPEC_LOOKUP_ENABLED: ${SPEC_LOOKUP_ENABLED:-false}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SERPAPI_ENDPOINT: ${SERPAPI_ENDPOINT:-https://serpapi.com/search.json}
      SPEC_LOOKUP_TIMEOUT_MS: ${SPEC_LOOKUP_TIMEOUT_MS:-12000}
      SPEC_LOOKUP_SEARCH_TIMEOUT_MS: ${SPEC_LOOKUP_SEARCH_TIMEOUT_MS:-12000}
      SPEC_LOOKUP_FETCH_TIMEOUT_MS: ${SPEC_LOOKUP_FETCH_TIMEOUT_MS:-12000}
      SPEC_LOOKUP_EXTRACTION_TIMEOUT_MS: ${SPEC_LOOKUP_EXTRACTION_TIMEOUT_MS:-35000}
      SPEC_LOOKUP_TOTAL_TIMEOUT_MS: ${SPEC_LOOKUP_TOTAL_TIMEOUT_MS:-90000}
      SPEC_LOOKUP_MAX_RESULTS: ${SPEC_LOOKUP_MAX_RESULTS:-5}
      SPEC_LOOKUP_ALLOWED_DOMAINS_ONLY: ${SPEC_LOOKUP_ALLOWED_DOMAINS_ONLY:-true}
      SPEC_LOOKUP_CACHE_ENABLED: ${SPEC_LOOKUP_CACHE_ENABLED:-true}
      SPEC_LOOKUP_CACHE_TTL_DAYS: ${SPEC_LOOKUP_CACHE_TTL_DAYS:-90}
      SPEC_LOOKUP_MAX_FETCH_BYTES: ${SPEC_LOOKUP_MAX_FETCH_BYTES:-500000}
      AUTH_SERVICE_URL: http://auth-service:3002
      INTERNAL_API_TOKEN: "opsmind-internal-dev-token"

      NOTIFICATION_API_URL: http://notification-service:3000/api/notifications
      INTERNAL_SECRET: "supersecret"
    command: ["sh", "-c", "npm run worker"]
    volumes:
      - ./Services/inventory-backend/datasets/cache:/usr/src/app/datasets/cache
    networks:
      - opsmind-net
    restart: unless-stopped

  ai-service:
    image: opsmind-ai-service:local
    build:
      context: ./Services/ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    networks:
      - opsmind-net
    restart: unless-stopped

  opsmind-agentic-ai-service:
    image: opsmind-agentic-ai-service:local
    build:
      context: ./Services/opsmind-agentic-ai-service
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: "development"
      PORT: "4010"
      SERVICE_NAME: opsmind-agentic-ai-service
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      DATABASE_URL: mysql://opsmind:opsmind@mysql:3306/agentic_ai_db
      JWT_SECRET: "opsmind-local-jwt"
    ports:
      - "4010:4010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - opsmind-net
    restart: unless-stopped

  inventory-ai-service:
    image: opsmind-inventory-ai-service:local
    build:
      context: ./Services/inventory-ai-service
      dockerfile: Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-45000}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-45}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SERPAPI_ENDPOINT: ${SERPAPI_ENDPOINT:-https://serpapi.com/search.json}
      SPEC_LOOKUP_TIMEOUT_SECONDS: ${SPEC_LOOKUP_TIMEOUT_SECONDS:-8}
      SPEC_HTTP_RETRY_ATTEMPTS: ${SPEC_HTTP_RETRY_ATTEMPTS:-3}
      SPEC_HTTP_BACKOFF_SECONDS: ${SPEC_HTTP_BACKOFF_SECONDS:-0.35}
      SPEC_LOOKUP_CIRCUIT_FAILURES: ${SPEC_LOOKUP_CIRCUIT_FAILURES:-4}
      SPEC_LOOKUP_CIRCUIT_RESET_SECONDS: ${SPEC_LOOKUP_CIRCUIT_RESET_SECONDS:-90}
      SPEC_ENABLE_LOCAL_MODEL_CATALOG: "0"
      SPEC_REAL_SPECS_ONLY: "1"
      SPEC_RULE_VERSION_CONTROL: ${SPEC_RULE_VERSION_CONTROL:-spec-rules-v1}
      SPEC_RULE_VERSION_CANDIDATE: ${SPEC_RULE_VERSION_CANDIDATE:-spec-rules-v2}
      SPEC_AB_ROLLOUT_PERCENT: ${SPEC_AB_ROLLOUT_PERCENT:-20}
      SPEC_FORCE_VARIANT: ${SPEC_FORCE_VARIANT:-}
      SPEC_VERIFICATION_CONFIDENCE_THRESHOLD: ${SPEC_VERIFICATION_CONFIDENCE_THRESHOLD:-0.85}
      SPEC_VARIANT_POLICY_PATH: /app/data/spec_variant_policy.json
      SPEC_PROMOTION_MIN_EVALS: ${SPEC_PROMOTION_MIN_EVALS:-40}
      SPEC_PROMOTION_MIN_IMPROVEMENT: ${SPEC_PROMOTION_MIN_IMPROVEMENT:-0.01}
      INVENTORY_AI_DATA_DIR: /app/data
    volumes:
      - ./Services/inventory-ai-service/data:/app/data
      - ./Services/inventory-ai-service/models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - opsmind-net
    restart: unless-stopped

  inventory-ai-scheduler:
    image: opsmind-inventory-ai-service:local
    build:
      context: ./Services/inventory-ai-service
      dockerfile: Dockerfile
    depends_on:
      inventory-ai-service:
        condition: service_healthy
    command: ["python", "-m", "src.scheduler"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-45000}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-45}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      INVENTORY_AI_DATA_DIR: /app/data
      SPEC_GOLDEN_PATH: /app/data/spec_golden_dataset.jsonl
      SPEC_FEEDBACK_CACHE_PATH: /app/data/spec_feedback_cache.json
      SPEC_VARIANT_POLICY_PATH: /app/data/spec_variant_policy.json
      LIFESPAN_TRAIN_DATA_PATH: /app/data/lifespan_training.csv
      LIFESPAN_MODEL_DIR: /app/models
      LIFESPAN_RECALIBRATION_METADATA_PATH: /app/data/lifespan_recalibration_metadata.json
      LIFECYCLE_LABELS_CSV: /app/data/lifecycle_outcomes_labels.csv
      INVENTORY_BACKEND_URL: http://inventory-backend:5000
      INVENTORY_DATABASE_URL: postgresql://postgres:IS1234567@postgres-inventory:5432/opsmind_assets
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-60}
      SPEC_DAILY_HOUR_UTC: ${SPEC_DAILY_HOUR_UTC:-1}
      SPEC_DAILY_MINUTE_UTC: ${SPEC_DAILY_MINUTE_UTC:-0}
      LIFESPAN_MONTHLY_DAY_UTC: ${LIFESPAN_MONTHLY_DAY_UTC:-1}
      LIFESPAN_MONTHLY_HOUR_UTC: ${LIFESPAN_MONTHLY_HOUR_UTC:-2}
      LIFESPAN_MONTHLY_MINUTE_UTC: ${LIFESPAN_MONTHLY_MINUTE_UTC:-0}
      WEEKLY_RETRAIN_DAY_UTC: ${WEEKLY_RETRAIN_DAY_UTC:-0}
      WEEKLY_RETRAIN_HOUR_UTC: ${WEEKLY_RETRAIN_HOUR_UTC:-3}
      WEEKLY_RETRAIN_MINUTE_UTC: ${WEEKLY_RETRAIN_MINUTE_UTC:-0}
      PROXY_LABEL_WEIGHT: ${PROXY_LABEL_WEIGHT:-0.2}
      SPEC_PROMOTION_MIN_EVALS: ${SPEC_PROMOTION_MIN_EVALS:-40}
      SPEC_PROMOTION_MIN_IMPROVEMENT: ${SPEC_PROMOTION_MIN_IMPROVEMENT:-0.01}
    volumes:
      - ./Services/inventory-ai-service/data:/app/data
      - ./Services/inventory-ai-service/models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - opsmind-net
    restart: unless-stopped

  reporting-service:
    image: opsmind-report-service:local
    build:
      context: ./Services/reportandanalysis-service
    depends_on:
      - mongodb
      - rabbitmq
      - auth-service
      - ticket-service
    environment:
      PORT: "3000"

      # Mongo (local container)
      MONGO_URI: mongodb://mongodb:27017/reporting

      # RabbitMQ (same network)
      RABBITMQ_USER: opsmind
      RABBITMQ_PASS: opsmind
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_EXCHANGE: opsmind.events
      RABBITMQ_QUEUE: reporting.analytics.queue
      TICKET_SERVICE_URL: http://ticket-service:3000
      AUTH_SERVICE_URL: http://auth-service:3002
      REPORT_SYNC_URL: http://127.0.0.1:3000/analytics/sync

    ports:
      - "3006:3000"
    networks:
      - opsmind-net
    restart: unless-stopped     

  # ─────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────
  opsmind-frontend:
    image: opsmind-frontend:local
    build:
      context: ./opsmind_frontend
      dockerfile: Dockerfile
    depends_on:
      auth-service:
        condition: service_started
      ticket-service:
        condition: service_started
      workflow-service:
        condition: service_started
    environment:
      OPSMIND_API_URL: ${OPSMIND_API_URL:-http://localhost:3012}
      OPSMIND_TICKET_URL: ${OPSMIND_TICKET_URL:-http://localhost:3001}
      OPSMIND_WORKFLOW_API_URL: ${OPSMIND_WORKFLOW_API_URL:-http://localhost:3003}
      OPSMIND_AI_API_URL: ${OPSMIND_AI_API_URL:-http://localhost:8001}
      OPSMIND_AGENTIC_AI_API_URL: ${OPSMIND_AGENTIC_AI_API_URL:-http://localhost:4010}
      OPSMIND_INVENTORY_AI_API_URL: ${OPSMIND_INVENTORY_AI_API_URL:-http://localhost:8002}
      OPSMIND_SLA_URL: ${OPSMIND_SLA_URL:-http://localhost:3004}
      OPSMIND_NOTIFICATION_URL: ${OPSMIND_NOTIFICATION_URL:-http://localhost:3005/api/notifications}
      OPSMIND_INVENTORY_API_URL: ${OPSMIND_INVENTORY_API_URL:-http://localhost:5000/api}
      OPSMIND_REPORT_API_URL: ${OPSMIND_REPORT_API_URL:-http://localhost:3006/analytics}
      NODE_ENV: production
      PORT: 85
    ports:
      - "8085:85"
    networks:
      - opsmind-net
    restart: unless-stopped

networks:
  opsmind-net: {}

volumes:
  mysql_data: {}
  mongodb_data: {}
  postgres_inventory_data: {}
