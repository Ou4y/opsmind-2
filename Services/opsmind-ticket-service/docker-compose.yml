version: "3.9"

services:
  ticket-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-runner}  # Use 'builder' for dev, 'runner' for prod
    container_name: opsmind-ticket-service
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000

      # Prisma / MySQL (shared infrastructure)
      DATABASE_URL: mysql://opsmind:opsmind@mysql:3306/Tickets

      # RabbitMQ (shared infrastructure)
      RABBITMQ_URL: amqp://opsmind:opsmind@rabbitmq:5672

      # User Service (for technician name resolution)
      USER_SERVICE_URL: http://opsmind-auth-service:3002

      # Workflow Service (for supervisor details in notifications)
      WORKFLOW_SERVICE_URL: http://opsmind-workflow:3003
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-opsmind-internal-dev-token}

      # AI Service
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-45000}
      AI_DEBUG_RAW_OUTPUT: ${AI_DEBUG_RAW_OUTPUT:-false}

      # SLA Service
      SLA_SERVICE_URL: http://opsmind-sla-service:3004

      # Frontend origins
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001,http://localhost:8085
    volumes:
      # Mount source code for development (comment out for production)
      - ./src:/app/src:ro
      - ./prisma:/app/prisma:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Prevent overwriting node_modules and dist
      - /app/node_modules
      - /app/dist
    command: ${SERVICE_COMMAND:-node dist/server.js}  # Override with 'npm run dev' for hot-reload
    networks:
      - opsmind-net
    restart: unless-stopped
networks:
  opsmind-net:
    external: true
