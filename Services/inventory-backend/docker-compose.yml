services:
  postgres:
    image: postgres:17-alpine
    container_name: opsmind-postgres-inv
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-IS1234567}
      POSTGRES_DB: ${POSTGRES_DB:-opsmind_assets}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opsmind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    container_name: opsmind-mongodb-inv
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-opsmind_assets}
    volumes:
      - mongodb_data:/data/db
    networks:
      - opsmind-net
    restart: unless-stopped

  opsmind-rabbitmq:
    image: rabbitmq:3-management
    container_name: opsmind-rabbitmq-inv
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-opsmind}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-opsmind}
    networks:
      - opsmind-net

  inventory-backend:
    build: .
    container_name: opsmind-inventory-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-opsmind-local-jwt}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-IS1234567}@postgres:5432/${POSTGRES_DB:-opsmind_assets}
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER:-opsmind}:${RABBITMQ_DEFAULT_PASS:-opsmind}@opsmind-rabbitmq:5672
      INVENTORY_BACKEND_INTERNAL_URL: http://inventory-backend:5000
    depends_on:
      - postgres
      - opsmind-rabbitmq
    networks:
      - opsmind-net

  inventory-backend-worker:
    build: .
    container_name: opsmind-inventory-backend-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-opsmind-local-jwt}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-IS1234567}@postgres:5432/${POSTGRES_DB:-opsmind_assets}
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER:-opsmind}:${RABBITMQ_DEFAULT_PASS:-opsmind}@opsmind-rabbitmq:5672
    depends_on:
      - postgres
      - opsmind-rabbitmq
    networks:
      - opsmind-net

networks:
  opsmind-net:
    external: true

volumes:
  postgres_data:
  mongodb_data:
