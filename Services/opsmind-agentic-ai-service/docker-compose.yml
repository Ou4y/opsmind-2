services:
  opsmind-agentic-ai-service:
    container_name: opsmind-agentic-ai-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4010:4010"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4010}
      SERVICE_NAME: ${SERVICE_NAME:-opsmind-agentic-ai-service}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      ENDPOINT_AGENT_SHARED_SECRET: ${ENDPOINT_AGENT_SHARED_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8085}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8085}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8085}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      ENABLE_AGENT_DEVICE_ENDPOINTS: ${ENABLE_AGENT_DEVICE_ENDPOINTS:-false}
    networks:
      - opsmind-net
    restart: unless-stopped

networks:
  opsmind-net:
    external: true
