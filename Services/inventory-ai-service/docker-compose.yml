services:
  inventory-ai-service:
    image: opsmind-inventory-ai-service:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsmind-inventory-ai-service
    environment:
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SERPAPI_ENDPOINT: ${SERPAPI_ENDPOINT:-https://serpapi.com/search.json}
      SPEC_LOOKUP_TIMEOUT_SECONDS: ${SPEC_LOOKUP_TIMEOUT_SECONDS:-8}
      SPEC_RULE_VERSION_CONTROL: ${SPEC_RULE_VERSION_CONTROL:-spec-rules-v1}
      SPEC_RULE_VERSION_CANDIDATE: ${SPEC_RULE_VERSION_CANDIDATE:-spec-rules-v2}
      SPEC_AB_ROLLOUT_PERCENT: ${SPEC_AB_ROLLOUT_PERCENT:-20}
      SPEC_FORCE_VARIANT: ${SPEC_FORCE_VARIANT:-}
      SPEC_VERIFICATION_CONFIDENCE_THRESHOLD: ${SPEC_VERIFICATION_CONFIDENCE_THRESHOLD:-0.85}
      INVENTORY_AI_DATA_DIR: /app/data
    ports:
      - "8002:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    networks:
      - opsmind-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  inventory-ai-scheduler:
    image: opsmind-inventory-ai-service:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsmind-inventory-ai-scheduler
    depends_on:
      inventory-ai-service:
        condition: service_healthy
    command: ["python", "-m", "src.scheduler"]
    environment:
      INVENTORY_AI_DATA_DIR: /app/data
      SPEC_GOLDEN_PATH: /app/data/spec_golden_dataset.jsonl
      SPEC_FEEDBACK_CACHE_PATH: /app/data/spec_feedback_cache.json
      LIFESPAN_TRAIN_DATA_PATH: /app/data/lifespan_training.csv
      LIFESPAN_MODEL_DIR: /app/models
      LIFESPAN_RECALIBRATION_METADATA_PATH: /app/data/lifespan_recalibration_metadata.json
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-60}
      SPEC_DAILY_HOUR_UTC: ${SPEC_DAILY_HOUR_UTC:-1}
      SPEC_DAILY_MINUTE_UTC: ${SPEC_DAILY_MINUTE_UTC:-0}
      LIFESPAN_MONTHLY_DAY_UTC: ${LIFESPAN_MONTHLY_DAY_UTC:-1}
      LIFESPAN_MONTHLY_HOUR_UTC: ${LIFESPAN_MONTHLY_HOUR_UTC:-2}
      LIFESPAN_MONTHLY_MINUTE_UTC: ${LIFESPAN_MONTHLY_MINUTE_UTC:-0}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    networks:
      - opsmind-net

networks:
  opsmind-net:
    external: true
